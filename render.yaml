# One Render web service runs the Express API and serves the built React site.
# MySQL is hosted separately (e.g. Aiven free MySQL) — set DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: aerolex
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
